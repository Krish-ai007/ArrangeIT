<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seating Pro</title>
    <link rel="stylesheet" href="page.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
</head>
<body onload="toggleSeatType()">

    <h1>ArrangeIT</h1>
    <h2>Creating the Ideal Seating Arrangement for Every Exam</h2>

    <div id="container">
        <fieldset id="fieldset">
            <form id="seatingForm">
                <div id="form">
                    <label>Title of Seating Arrangement:</label>
                    <input type="text" id="seatingTitle" placeholder="Class, Exam Name, Year"><br>
                    
                    <label>Number of Students:</label>
                    <input type="number" id="studentCount"><br>
                    
                    <label>Columns:</label>
                    <input type="number" id="columns"><br>
                    
                    <label>Rows:</label>
                    <input type="number" id="rows"><br>
                    
                    <label>Name of Streams:</label>
                    <input type="text" id="streams" placeholder="Separated by comma (,)">
                    <div id="streamCountsContainer"></div>

                    <p>Type of seating:</p>
                    Single seat:
                    <input type="checkbox" id="singleSeat" value="single" onclick="toggleSeatType()">
                    Bench:
                    <input type="checkbox" id="benchSeat" value="bench" onclick="toggleSeatType()"><br>

                    <div id="benchInput">
                        <label for="studentsPerBench">Students per Bench:</label>
                        <input type="number" id="studentsPerBench" min="1" placeholder="e.g., 2 or 3">
                    </div>

                    <input id="button" type="button" value="GENERATE" onclick="generateSeating()">
                    <button id="downloadBtn" type="button" onclick="downloadSeating()">Download Seating</button>
                </div>
            </form>
        </fieldset>

        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
